# A version tag pushed (scripts/setup.sh release does it): the tests, then the downloads built
# from that commit and published as a GitHub release with what changed since the last one.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version number counts commits; the notes need the previous tag
      - name: Tests
        run: scripts/setup.sh test
      - name: Build
        run: scripts/setup.sh package "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(mktemp)"
          if previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null)"; then
            git log --format='**%s**%n%n%b' "$previous..$GITHUB_REF_NAME" | grep -v '^Co-Authored-By:' >> "$notes"
          fi
          echo "How to install: https://github.com/$GITHUB_REPOSITORY#install" >> "$notes"
          gh release create "$GITHUB_REF_NAME" build/release/CmdTabWheel.dmg build/release/CmdTabWheel.zip \
            --title "⌘Tab Wheel $GITHUB_REF_NAME" --notes-file "$notes"
