# On every push and pull request: the tests, then the download a release would publish.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version number counts commits
      - name: Tests
        run: scripts/setup.sh test
      - name: Release build
        run: scripts/setup.sh package
